name: Deploy Protected Demo
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kliks-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy exact verified source
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_KNOWN_HOSTS: ${{ vars.DEMO_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$DEMO_SSH_KEY"
          test -n "$DEMO_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEMO_SSH_KEY" > ~/.ssh/demo_key
          chmod 600 ~/.ssh/demo_key
          printf '%s\n' "$DEMO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/demo_key' EXIT
          git archive --format=tar.gz "$RELEASE_SHA" | ssh -i ~/.ssh/demo_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes kliks-deploy@165.232.64.119 "deploy $RELEASE_SHA"

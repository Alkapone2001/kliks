name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kliks:kliks_local_dev_only@localhost:5432/kliks?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kliks
          POSTGRES_PASSWORD: kliks_local_dev_only
          POSTGRES_DB: kliks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kliks -d kliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure local-only database environment
        run: cp .env.example .env

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
